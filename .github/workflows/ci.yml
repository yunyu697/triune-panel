name: CI

# 只做三件事：静态检查、单元测试、三平台能否编译。
# 之所以加这道闸：apply/回滚这类路径一旦回归会直接改坏用户的运行配置，
# 而本项目此前完全依赖手工 e2e 验证。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet + test + 交叉编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: 四平台交叉编译（发布用的就是这四份）
        run: |
          set -euo pipefail
          mkdir -p dist
          # 必须与 deploy/release.sh 的 TARGETS 一致：发布带几个平台，
          # 这里就得编几个，否则某个平台编不过要到发版时才发现。
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "→ ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.Version=ci" \
              -o "dist/triune-panel-${os}-${arch}" ./cmd/server
          done
          ls -l dist

      - name: 二进制自检（仅同架构可执行）
        run: |
          set -euo pipefail
          ./dist/triune-panel-linux-amd64 -version
          ./dist/triune-panel-linux-amd64 help >/dev/null
          # -version 必须输出 "triune-panel <ver> (<os>/<arch>)"：
          # install.sh 用 `-version | awk '{print $2}'` 取版本做终检，格式不能变
          ver=$(./dist/triune-panel-linux-amd64 -version | awk '{print $2}')
          test "$ver" = "ci" || { echo "版本字段解析异常: $ver"; exit 1; }

  version:
    name: 版本号格式（次/修订位 0–9）
    runs-on: ubuntu-latest
    # 只在推 tag 时跑：分支推送没有版本号可校验
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: 校验 tag
        run: |
          # 规则：主版本任意位数；次版本、修订号只用 0–9，满 9 进位
          #   v1.0.9 → v1.1.0 · v1.9.9 → v2.0.0 · v9.9.9 → v10.0.0
          # 判定只写在 deploy/check-version.sh 里，这里只负责调用，
          # 免得 CI 和发布流程各抄一份正则、慢慢长歪。
          ./deploy/check-version.sh "$GITHUB_REF_NAME"

  shellcheck:
    name: shellcheck（deploy 脚本）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          # SC2206：ver_lt 里故意用 IFS=. 做数组拆分，属预期用法
          shellcheck -S warning -e SC2206 \
            deploy/install.sh deploy/uninstall.sh deploy/check-version.sh deploy/release.sh

      - name: 中文标点紧跟变量（$VAR，）
        run: |
          # bash 会把中文标点的首字节算进变量名，set -u 下直接 unbound variable。
          # shellcheck 查不出来（它认 UTF-8 字节为标识符的一部分），只能自己扫。
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for p in glob.glob("deploy/*.sh"):
              for i, line in enumerate(open(p, encoding="utf-8"), 1):
                  for m in re.finditer(r"\$[A-Za-z_][A-Za-z0-9_]*", line):
                      nxt = line[m.end():m.end() + 1]
                      if nxt and ord(nxt) > 127:
                          # 注意别在这里写美元符加大括号：那是 Actions 的表达式语法，
                          # 会让整个 workflow 文件解析失败（这次就踩了）。
                          fixed = "${" + m.group(0)[1:] + "}"
                          bad.append(f"{p}:{i}: {m.group(0)}{nxt}  ← 应写成 {fixed}{nxt}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("OK：没有变量紧跟中文标点")
          PY
