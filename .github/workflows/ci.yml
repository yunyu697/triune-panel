name: CI

# 只做三件事：静态检查、单元测试、三平台能否编译。
# 之所以加这道闸：apply/回滚这类路径一旦回归会直接改坏用户的运行配置，
# 而本项目此前完全依赖手工 e2e 验证。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet + test + 交叉编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: 三平台交叉编译（发布用的就是这三份）
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "→ ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.Version=ci" \
              -o "dist/triune-panel-${os}-${arch}" ./cmd/server
          done
          ls -l dist

      - name: 二进制自检（仅同架构可执行）
        run: |
          set -euo pipefail
          ./dist/triune-panel-linux-amd64 -version
          ./dist/triune-panel-linux-amd64 help >/dev/null
          # -version 必须输出 "triune-panel <ver> (<os>/<arch>)"：
          # install.sh 用 `-version | awk '{print $2}'` 取版本做终检，格式不能变
          ver=$(./dist/triune-panel-linux-amd64 -version | awk '{print $2}')
          test "$ver" = "ci" || { echo "版本字段解析异常: $ver"; exit 1; }

  shellcheck:
    name: shellcheck（deploy 脚本）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          # SC2206：ver_lt 里故意用 IFS=. 做数组拆分，属预期用法
          shellcheck -S warning -e SC2206 deploy/install.sh deploy/uninstall.sh
