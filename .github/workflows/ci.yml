name: CI

# 静态检查、单元测试、四平台能否编译、发布脚本静态检查、首屏浏览器回归。
# 之所以加这道闸：apply/回滚这类路径一旦回归会直接改坏用户的运行配置，
# 而首屏闪动 / 主题切换这类问题 Go 单测完全碰不到，必须在真浏览器里量首帧。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet + test + 交叉编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: 四平台交叉编译（发布用的就是这四份）
        run: |
          set -euo pipefail
          mkdir -p dist
          # 必须与 deploy/release.sh 的 TARGETS 一致：发布带几个平台，
          # 这里就得编几个，否则某个平台编不过要到发版时才发现。
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "→ ${os}/${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.Version=ci" \
              -o "dist/triune-panel-${os}-${arch}" ./cmd/server
          done
          ls -l dist

      - name: 二进制自检（仅同架构可执行）
        run: |
          set -euo pipefail
          ./dist/triune-panel-linux-amd64 -version
          ./dist/triune-panel-linux-amd64 help >/dev/null
          # -version 必须输出 "triune-panel <ver> (<os>/<arch>)"：
          # install.sh 用 `-version | awk '{print $2}'` 取版本做终检，格式不能变
          ver=$(./dist/triune-panel-linux-amd64 -version | awk '{print $2}')
          test "$ver" = "ci" || { echo "版本字段解析异常: $ver"; exit 1; }

  version:
    name: 版本号格式（次/修订位 0–9）
    runs-on: ubuntu-latest
    # 只在推 tag 时跑：分支推送没有版本号可校验
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: 校验 tag
        run: |
          # 规则：主版本任意位数；次版本、修订号只用 0–9，满 9 进位
          #   v1.0.9 → v1.1.0 · v1.9.9 → v2.0.0 · v9.9.9 → v10.0.0
          # 判定只写在 deploy/check-version.sh 里，这里只负责调用，
          # 免得 CI 和发布流程各抄一份正则、慢慢长歪。
          ./deploy/check-version.sh "$GITHUB_REF_NAME"

  shellcheck:
    name: shellcheck（deploy 脚本）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          # SC2206：ver_lt 里故意用 IFS=. 做数组拆分，属预期用法
          shellcheck -S warning -e SC2206 \
            deploy/install.sh deploy/uninstall.sh deploy/check-version.sh \
            deploy/release.sh deploy/verify-release.sh deploy/tests/*.sh

      - name: 中文标点紧跟变量（$VAR，）
        run: |
          # bash 会把中文标点的首字节算进变量名，set -u 下直接 unbound variable。
          # shellcheck 查不出来（它认 UTF-8 字节为标识符的一部分），只能自己扫。
          python3 - <<'PY'
          import glob, re, sys
          bad = []
          for p in glob.glob("deploy/*.sh") + glob.glob("deploy/tests/*.sh"):
              for i, line in enumerate(open(p, encoding="utf-8"), 1):
                  for m in re.finditer(r"\$[A-Za-z_][A-Za-z0-9_]*", line):
                      nxt = line[m.end():m.end() + 1]
                      if nxt and ord(nxt) > 127:
                          # 注意别在这里写美元符加大括号：那是 Actions 的表达式语法，
                          # 会让整个 workflow 文件解析失败（这次就踩了）。
                          fixed = "${" + m.group(0)[1:] + "}"
                          bad.append(f"{p}:{i}: {m.group(0)}{nxt}  ← 应写成 {fixed}{nxt}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("OK：没有变量紧跟中文标点")
          PY

      - name: 发布链离线回归（deploy/tests）
        # 用 glob 循环：新增脚本自动被跑到，不需要维护白名单。全部桩掉 curl/git，
        # 不联网、不耗 GitHub API 配额，验证 CDN 504 回退 / 匿名索引 / 断点续跑
        # / install.sh 下载分支 / 版本号进位这些 Go 单测碰不到的脚本行为。
        run: |
          set -euo pipefail
          for s in deploy/tests/*.sh; do
            echo "→ ${s}"
            bash "$s"
          done

  first-paint:
    name: 首屏回归（Playwright / Chromium）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .e2e/package-lock.json

      - name: 安装 Playwright 与 Chromium
        run: |
          npm ci --prefix .e2e
          # 走命令行的绝对路径，别用 npx --prefix（npm 版本不同行为不一致）
          ./.e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: 中文字体（布局断言要量真实文本宽度）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: demo.html 与 index.html 必须同步
        # 离线回归全部跑在 demo.html 上；它一旦过期，浏览器测的就是旧界面，
        # 而且不会报错——只能靠 TestDemoHTMLMatchesIndex 钉住。
        run: go test ./internal/webui/ -run TestDemoHTMLMatchesIndex -count=1

      - name: 离线首屏 / 主题 / 分组回归（file://demo.html）
        env:
          # browser.js 默认用本机 Chrome；CI 没有，改用 Playwright 自带的 Chromium
          E2E_CHANNEL: bundled
        run: |
          set -euo pipefail
          for s in first-paint-flicker view-restore theme-switch-flicker \
                   section-restore bypass-server layout-check backups-hostopt workbench-command; do
            echo "→ ${s}"
            node ".e2e/${s}.js"
          done

      - name: 真后端首屏回归（/api/status 延迟 / 401 / 网络错误）
        env:
          E2E_CHANNEL: bundled
        run: |
          set -euo pipefail
          # 传绝对路径给 E2E_TP_BIN：脚本自己构建时会顺手把产物删掉，
          # 这里复用 CI 刚编好的二进制，也省一次 go build。
          go build -o .e2e/tp-first-paint ./cmd/server
          E2E_TP_BIN="$PWD/.e2e/tp-first-paint" node .e2e/first-paint-server.js
